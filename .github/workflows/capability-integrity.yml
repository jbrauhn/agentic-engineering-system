# Repository representation revision 4 paths
name: Capability Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-integrity:
    name: capability-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate capability contracts, bindings, runtime semantics, and OEB fixtures
        run: python reference/validators/validate_capabilities.py reference/protocols/capability_contracts.json reference/scenarios/capability_scenarios.json reference/fixtures/oeb_fixtures.json
