# Repository hardening revision 5
name: Adoption Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adoption-integrity:
    name: adoption-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble exact reference distribution
        run: python tools/assemble_distribution.py --repo . --output /tmp/ae-distribution
      - name: Prepare isolated clean-room supplied input
        run: |
          mkdir -p /tmp/clean-room-input /tmp/clean-room-run
          cp reference/fixtures/clean_room_adoption_baseline.json /tmp/clean-room-input/supplied_baseline.json
      - name: Derive clean-room implementation Plan from distribution plus supplied baseline only
        run: >-
          cd /tmp/clean-room-run &&
          python /tmp/ae-distribution/tools/clean-room/run_clean_room_adoption.py
          --distribution /tmp/ae-distribution
          --baseline /tmp/clean-room-input/supplied_baseline.json
          --output /tmp/clean-room-plan.json
      - name: Validate adoption distribution conformance interface parity and integrated Proof
        run: >-
          python reference/validators/validate_adoption.py
          reference/protocols/adoption_distribution_protocol.json
          reference/scenarios/adoption_scenarios.json
          reference/fixtures/adoption_portability_fixtures.json
          canonical_ae_release_manifest.json
          reference/fixtures/synthetic_organization_fixture.json
          reference/loops/reference_ae_loops.json
          /tmp/clean-room-plan.json
          reference/fixtures/clean_room_adoption_baseline.json
          /tmp/ae-distribution
          reference/protocols/context_protocol.json
          reference/protocols/capability_contracts.json
          reference/protocols/authority_protocol.json
          reference/protocols/lifecycle_protocol.json
          reference/protocols/validation_protocol.json
          reference/protocols/standards_health_protocol.json
          reference/protocols/observability_learning_protocol.json
