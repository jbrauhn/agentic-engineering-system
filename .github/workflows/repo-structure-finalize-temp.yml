name: Temporary Repository Structure Finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repo-structure-finalize-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace non-workflow Level 1 path references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.').resolve()
          targets = [root / 'canonical_ae_release_manifest.json', root / 'README.md', root / 'START_HERE.md']
          for base in ['reference', 'tools', 'adoption', 'docs']:
              folder = root / base
              if folder.exists():
                  targets.extend(p for p in folder.rglob('*') if p.is_file() and p.suffix.lower() in {'.md','.json','.py','.yml','.yaml'})

          changed = 0
          for p in targets:
              text = p.read_text(encoding='utf-8')
              new = text.replace('canonical/l1/', 'canonical/level-1/')
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed += 1

          assert (root / 'canonical/level-1').is_dir()
          assert not (root / 'canonical/l1').exists()
          print(f'updated {changed} non-workflow files to canonical/level-1/')
          PY

      - name: Verify rev4 distribution still assembles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ae-rev4
          python tools/assemble_distribution.py --repo . --output /tmp/ae-rev4
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('canonical_ae_release_manifest.json').read_text())
          i=json.loads(Path('/tmp/ae-rev4/RELEASE_INVENTORY.json').read_text())
          assert m['distribution_revision']==4
          assert m['semantic_layers']['CANONICAL_CORE']['selectors'][1]=='canonical/level-1/*/L1-*.md'
          assert len(i['artifacts'])==174, len(i['artifacts'])
          print('Level 1 path migration PASS: 174 artifacts')
          PY

      - name: Commit non-workflow path updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canonical_ae_release_manifest.json README.md START_HERE.md reference tools adoption docs
          if git diff --cached --quiet; then
            echo 'No non-workflow path updates needed'
          else
            git commit -m 'Use explicit level-1 path in repository representation'
            git push origin HEAD:${{ github.head_ref }}
          fi
