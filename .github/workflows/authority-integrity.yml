name: Authority Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-integrity:
    name: authority-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate authority protocol, scenarios, portability, capability coverage, and lifecycle linkage
        run: python validate_authority.py authority_protocol.json authority_scenarios.json authority_portability_fixtures.json capability_contracts.json lifecycle_protocol.json
