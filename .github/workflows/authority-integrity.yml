name: Authority Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-integrity:
    name: authority-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate authority protocol, scenarios, portability, capability coverage, and lifecycle linkage
        run: python reference/validators/validate_authority.py reference/protocols/authority_protocol.json reference/scenarios/authority_scenarios.json reference/fixtures/authority_portability_fixtures.json reference/protocols/capability_contracts.json reference/protocols/lifecycle_protocol.json
