name: Observability Learning Integrity

on:
  pull_request:
    paths:
      - 'L1-K_*'
      - 'DR-133-*'
      - 'DR-134-*'
      - 'DR-135-*'
      - 'ADR-009-*'
      - 'observability_learning_*.json'
      - 'validate_observability_learning.py'
      - 'lifecycle_protocol.json'
      - 'capability_contracts.json'
      - 'authority_protocol.json'
      - 'context_protocol.json'
      - 'planning_execution_protocol.json'
      - 'validation_protocol.json'
      - 'standards_health_protocol.json'
      - 'L1-L_*'
      - 'adoption_distribution_protocol.json'
      - '.github/workflows/observability-learning-integrity.yml'
  workflow_dispatch:

jobs:
  observability-learning-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate observability metrics experiments learning portability and cross-domain semantics
        run: >-
          python validate_observability_learning.py
          observability_learning_protocol.json
          observability_learning_scenarios.json
          observability_learning_portability_fixtures.json
          lifecycle_protocol.json
          capability_contracts.json
          authority_protocol.json
          context_protocol.json
          planning_execution_protocol.json
          validation_protocol.json
          standards_health_protocol.json
