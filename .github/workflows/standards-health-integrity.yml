name: Standards Health Integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standards-health-integrity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate standards applicability engineering health portability and cross-domain semantics
        run: >-
          python validate_standards_health.py
          standards_health_protocol.json
          standards_health_scenarios.json
          standards_health_portability_fixtures.json
          lifecycle_protocol.json
          capability_contracts.json
          authority_protocol.json
          context_protocol.json
          planning_execution_protocol.json
          validation_protocol.json