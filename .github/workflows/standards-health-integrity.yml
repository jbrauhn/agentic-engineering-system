name: Standards Health Integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standards-health-integrity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate standards applicability engineering health portability and cross-domain semantics
        run: >-
          python reference/validators/validate_standards_health.py
          reference/protocols/standards_health_protocol.json
          reference/scenarios/standards_health_scenarios.json
          reference/fixtures/standards_health_portability_fixtures.json
          reference/protocols/lifecycle_protocol.json
          reference/protocols/capability_contracts.json
          reference/protocols/authority_protocol.json
          reference/protocols/context_protocol.json
          reference/protocols/planning_execution_protocol.json
          reference/protocols/validation_protocol.json
