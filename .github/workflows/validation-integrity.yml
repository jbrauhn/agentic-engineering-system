name: Validation Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-integrity:
    name: validation-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Validation protocol scenarios portability and cross-domain semantics
        run: >-
          python reference/validators/validate_validation.py
          reference/protocols/validation_protocol.json
          reference/scenarios/validation_scenarios.json
          reference/fixtures/validation_portability_fixtures.json
          reference/protocols/lifecycle_protocol.json
          reference/protocols/capability_contracts.json
          reference/protocols/authority_protocol.json
          reference/protocols/context_protocol.json
          reference/protocols/planning_execution_protocol.json
