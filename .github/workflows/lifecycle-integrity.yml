# Repository representation revision 4 paths
name: Lifecycle Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-integrity:
    name: lifecycle-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate lifecycle protocol and main scenario fixtures
        run: python reference/validators/validate_lifecycle.py reference/protocols/lifecycle_protocol.json reference/scenarios/lifecycle_scenarios.json
      - name: Validate G5 Contract Change gate and revision effectivity
        run: python reference/validators/validate_contract_change_gate.py reference/protocols/lifecycle_protocol.json reference/scenarios/contract_change_gate_scenarios.json
      - name: Intentional ruleset enforcement failure
        run: |
          echo "Intentional failure: proves required-check enforcement blocks merge."
          exit 1
