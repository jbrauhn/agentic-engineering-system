name: Context Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-integrity:
    name: context-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate context protocol, scenarios, portability, and cross-domain semantics
        run: python reference/validators/validate_context.py reference/protocols/context_protocol.json reference/scenarios/context_scenarios.json reference/fixtures/context_portability_fixtures.json reference/protocols/capability_contracts.json reference/protocols/lifecycle_protocol.json reference/protocols/authority_protocol.json
