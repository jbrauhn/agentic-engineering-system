name: Context Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-integrity:
    name: context-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate context protocol, scenarios, portability, and cross-domain semantics
        run: python validate_context.py context_protocol.json context_scenarios.json context_portability_fixtures.json capability_contracts.json lifecycle_protocol.json authority_protocol.json
