# Repository representation revision 4 paths
name: Planning Execution Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-execution-integrity:
    name: planning-execution-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate planning execution protocol scenarios portability and cross-domain semantics
        run: >-
          python reference/validators/validate_planning_execution.py
          reference/protocols/planning_execution_protocol.json
          reference/scenarios/planning_execution_scenarios.json
          reference/fixtures/planning_execution_portability_fixtures.json
          reference/protocols/lifecycle_protocol.json
          reference/protocols/capability_contracts.json
          reference/protocols/authority_protocol.json
          reference/protocols/context_protocol.json
